[project]
name = "recoveryos"
version = "0.1.0"
description = "Autonomous operations system that preserves business outcomes through agentic failure recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Google ADK - Agent framework
    "google-adk>=1.2.0",
    # Firestore - Durable state persistence
    "google-cloud-firestore>=2.19.0",
    # Pub/Sub - Async event-driven execution
    "google-cloud-pubsub>=2.27.0",
    # FastAPI - API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Pydantic - Data models (also used by ADK)
    "pydantic>=2.10.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
